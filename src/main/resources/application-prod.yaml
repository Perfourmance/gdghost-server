# 운영 서버. 값은 서버 환경변수(GitHub Secrets → 배포)로만 받는다
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:                         # 운영은 메일 계정 필수 — 없으면 기동 실패
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

web:                            # 운영은 필수 — 없으면 기동 실패
  url: ${WEB_URL}

discord:                        # 운영은 3개 모두 필수 — 없거나 https가 아니면 기동 실패
  required: true
  webhook:
    member: ${DISCORD_MEMBER_WEBHOOK_URL}
    staff: ${DISCORD_STAFF_WEBHOOK_URL}
    dev: ${DISCORD_DEV_WEBHOOK_URL}

push:                           # 운영은 필수 — 없으면 기동 실패
  required: true
  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}

springdoc:                      # 운영에서는 API 문서를 열지 않는다
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
