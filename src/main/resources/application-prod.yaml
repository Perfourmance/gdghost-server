# 운영 서버. 값은 서버 환경변수(GitHub Secrets → 배포)로만 받는다
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:                      # 운영에서는 API 문서를 열지 않는다
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
