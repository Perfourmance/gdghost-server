# 모든 프로필 공통. 비밀값은 여기 적지 않고 환경변수(로컬은 .env)로만 받는다
spring:
  application:
    name: gdghost-server
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway로만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
