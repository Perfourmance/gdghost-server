# 모든 프로필 공통. 비밀값은 여기 적지 않고 환경변수(로컬은 .env)로만 받는다
spring:
  application:
    name: gdghost-server
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway로만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:                         # 동아리 Gmail. 계정이 없으면(로컬) 보내지 않고 서버 로그에 찍는다
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  task:
    execution:                  # @Async 이벤트 리스너
      thread-name-prefix: async-
      shutdown:
        await-termination: true   # 배포로 내려갈 때 돌던 리스너를 끝내고
        await-termination-period: 10s
    scheduling:                 # @Scheduled 배치
      thread-name-prefix: batch-
      shutdown:
        await-termination: true
        await-termination-period: 10s

push:                           # 웹 푸시 VAPID 키(비밀값). 비워 두면(로컬) 보내지 않고 서버 로그에 찍는다. 바꾸면 모든 구독이 무효
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}

embedding:                      # Workers AI 계정 ID · 토큰(비밀값). 비워 두면(로컬) 호출하지 않는다
  account-id: ${CLOUDFLARE_ACCOUNT_ID:}
  api-token: ${WORKERS_AI_API_TOKEN:}

r2:                             # 사진 저장소(비밀값). 비워 두면(로컬) 업로드 API는 500, 사진 정리 배치는 건너뛴다
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket: ${R2_BUCKET:}

matching:                       # 후보 계산 설정. AI팀이 조정한다. 값을 바꾸면 version을 올린다 (AI 매칭 설계 5장)
  version: 2026-10-v1
  weights: { rule: 0.4, profile: 0.3, history: 0.3 }
  rule: { experience: 0.6, interest: 0.3, department: 0.2, position: 0.1, senior: 0.1 }
  history: { adopted-bonus: 0.1, reason-min: 0.6 }
  activity: { answer-count-cap: 10, per-answer: 0.01, recent-days: 30, recent-bonus: 0.05, pass-penalty: 0.05 }
  min-score: 0.15               # activity를 뺀 점수와 비교. 실측(2026-10-31): 맞는 짝 유사도 0.53–0.68
  max-candidates: 3             # 처음 보내는 인원
  max-per-question: 5           # 넘기기 보충 · 지목을 합친 질문당 상한
  direct-timeout-hours: 24      # 지목받은 선배가 반응이 없으면 일반 라우팅 시작
  use-questioner-rules-on-anonymous: false
  category-experience:
    JOB: [인턴, 정규직 취업, 공모전 수상, 해커톤, 자격증]
    CAREER: [정규직 취업, 이직, 창업, 프리랜서·외주]
    PATH: [대학원 진학, 학부연구생, 휴학, 군 복무, 교환학생, 창업]
    CAMPUS: [복수·부전공, 교환학생, 편입, 휴학, 동아리 운영진, 학부연구생]
    STUDY: [오픈소스 기여, 해커톤, 공모전 수상, 학부연구생]

web:                            # 프론트 주소. 메일 링크에 쓴다
  url: ${WEB_URL:http://localhost:3000}

discord:                        # 웹훅 주소(비밀값). 비워 두면(로컬) 보내지 않고 서버 로그에 찍는다
  webhook:
    member: ${DISCORD_MEMBER_WEBHOOK_URL:}      # 기존 GDGoC 서버 #gdghost-알림
    staff: ${DISCORD_STAFF_WEBHOOK_URL:}        # 운영진 서버
    dev: ${DISCORD_DEV_WEBHOOK_URL:}            # 개발자 서버

bootstrap:                      # 서비스 첫 시작용. 비워 두면 아무것도 하지 않는다
  invite-code: ${BOOTSTRAP_INVITE_CODE:}          # invite_code가 0건일 때만 이 값으로 코드 1개 (10회 · 7일)
  generation: ${BOOTSTRAP_GENERATION:}            # 위 코드의 기수
  dev-login-ids: ${BOOTSTRAP_DEV_LOGIN_IDS:}      # 쉼표 구분 아이디 → 기동 때 DEV

springdoc:
  swagger-ui:
    csrf:
      enabled: true             # XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 보낸다 (CSRF는 M1)
    tags-sorter: alpha
    operations-sorter: alpha

management:
  health:
    mail:
      enabled: false            # 헬스 체크마다 SMTP에 접속하지 않게
  endpoints:
    web:
      exposure:
        include: health
