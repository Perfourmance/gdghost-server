# 모든 프로필 공통. 비밀값은 여기 적지 않고 환경변수(로컬은 .env)로만 받는다
spring:
  application:
    name: gdghost-server
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway로만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:                         # 동아리 Gmail. 계정이 없으면(로컬) 보내지 않고 서버 로그에 찍는다
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  task:
    execution:                  # @Async 이벤트 리스너
      thread-name-prefix: async-
      shutdown:
        await-termination: true   # 배포로 내려갈 때 돌던 리스너를 끝내고
        await-termination-period: 10s

springdoc:
  swagger-ui:
    csrf:
      enabled: true             # XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 보낸다 (CSRF는 M1)
    tags-sorter: alpha
    operations-sorter: alpha

management:
  health:
    mail:
      enabled: false            # 헬스 체크마다 SMTP에 접속하지 않게
  endpoints:
    web:
      exposure:
        include: health
