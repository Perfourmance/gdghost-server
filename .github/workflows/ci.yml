# PR과 main push마다 빌드 + 테스트. 잡 이름 build는 main 보호 규칙의 필수 체크로 쓴다
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새로 push하면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6   # Gradle 캐시 + wrapper 검증

      - name: 빌드 + 테스트
        run: ./gradlew build   # Testcontainers가 러너의 Docker로 MySQL을 띄운다

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
